{% extends 'blog/index.html' %}
{% load static %}

{% block static %} contact-Travel blog {% endblock %}

{% block content %}

<div class="bg-blue-50 min-h-screen py-10 px-4">

    <div class="max-w-6xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">
        
        <div class="grid md:grid-cols-2">

            <!-- Left Image -->
            <div class="hidden md:block h-full">
                <img src="{% static 'Imgs/contact.jpg' %}" 
                     class="w-full h-full object-cover">
            </div>

            <!-- Right Form -->
            <div class="p-6 md:p-10">
                
                <h1 class="text-3xl font-bold text-blue-700 text-center mb-6">
                    Contact Us
                </h1>

                {% include 'blog/message.html' %}

                <form method="POST" action="{% url 'contact' %}" class="space-y-5">
                    {% csrf_token %}

                    <!-- Full Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Full Name
                        </label>
                        <input type="text"
                               name="fullname"
                               placeholder="Enter your full name"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Email
                        </label>
                        <input type="email"
                               name="email"
                               placeholder="Enter your email"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <!-- Mobile -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Mobile
                        </label>
                        <input type="tel"
                               name="mob"
                               placeholder="Enter your mobile number"
                               required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <!-- Message -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Message
                        </label>
                        <textarea name="msg"
                                  rows="4"
                                  placeholder="Write your message..."
                                  required
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="flex gap-4">
                        <button type="submit"
                                class="w-full bg-blue-600 text-white py-2 rounded-lg shadow hover:bg-blue-700 transition">
                            Submit
                        </button>

                        <button type="reset"
                                class="w-full border border-yellow-400 text-yellow-500 py-2 rounded-lg hover:bg-yellow-100 transition">
                            Cancel
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
