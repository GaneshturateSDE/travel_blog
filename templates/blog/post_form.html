{% extends 'blog/index.html' %}
{% load static %}

{% block static %} TravelBlog-postform {% endblock %}

{% block content %}

<div class="bg-blue-50 min-h-screen py-10 px-4 flex items-center justify-center">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-10">

        <h2 class="text-2xl md:text-3xl font-bold text-blue-700 text-center mb-6">
            Create New Post ✍️
        </h2>

        {% include 'blog/message.html' %}

        <form method="POST" action="{% url 'post_blog' %}" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <!-- Title -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text" name="title" placeholder="Enter title"
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Destination -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Destination</label>
                <input type="text" name="destination" placeholder="Enter destination"
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Date -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                <input type="date" name="date"
                       required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" rows="4" placeholder="Write your experience..."
                          required
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>

            <!-- Image Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload Photos</label>

                <input type="file" name="images" multiple required
                       class="w-full text-sm text-gray-600 
                              file:mr-4 file:py-2 file:px-4 
                              file:rounded-lg file:border-0 
                              file:text-sm file:font-semibold 
                              file:bg-blue-600 file:text-white 
                              hover:file:bg-blue-700 cursor-pointer">
            </div>

            <!-- Video Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload Video (optional)</label>

                <input type="file" name="video"
                       class="w-full text-sm text-gray-600 
                              file:mr-4 file:py-2 file:px-4 
                              file:rounded-lg file:border-0 
                              file:text-sm file:font-semibold 
                              file:bg-blue-600 file:text-white 
                              hover:file:bg-blue-700 cursor-pointer">
            </div>

            <!-- Buttons -->
            <div class="flex gap-4 pt-3">
                
                <button type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded-lg shadow hover:bg-blue-700 transition">
                    Post
                </button>

                <a href="{% url 'home' %}"
                   class="w-full border border-gray-300 py-2 rounded-lg text-gray-600 text-center hover:bg-gray-100 transition">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
