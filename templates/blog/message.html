{% if messages %}
<div class="fixed top-20 right-4 z-50 space-y-3 w-full max-w-sm">

    {% for message in messages %}
    
    <div class="flex items-start justify-between gap-3 p-4 rounded-lg shadow-lg animate-slideIn
        {% if message.tags == 'success' %} bg-green-100 text-green-800 border border-green-300
        {% elif message.tags == 'error' %} bg-red-100 text-red-800 border border-red-300
        {% elif message.tags == 'warning' %} bg-yellow-100 text-yellow-800 border border-yellow-300
        {% else %} bg-blue-100 text-blue-800 border border-blue-300
        {% endif %}"
        id="alert-{{ forloop.counter }}">

        <!-- Message -->
        <p class="text-sm font-medium">
            {{ message }}
        </p>

        <!-- Close Button -->
        <button onclick="closeAlert('alert-{{ forloop.counter }}')" 
                class="text-lg font-bold leading-none hover:opacity-70">
            &times;
        </button>

    </div>

    {% endfor %}

</div>
{% endif %}
